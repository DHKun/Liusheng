[package]
name = "liusheng-core"
version = "0.2.1"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.16"
hound = "3.5.1"
lofty = "0.24.0"
notify = "8.2.0"
pinyin = "0.11.0"
rubato = { version = "4.0.0", default-features = false }
symphonia = { version = "0.6.0", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2.0.19"
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"
pipewire = { version = "0.10.0", features = ["v1_2_0"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.1"
rusqlite = "0.40.1"

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
