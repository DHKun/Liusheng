[package]
name = "liusheng-core"
version = "0.3.6"
edition = "2024"

# Exercise the developer tool in the default workspace test run on each OS.
[[example]]
name = "dev"
test = true

[features]
coreaudio-compile-check = ["dep:cpal"]

[dependencies]
crossbeam-channel = "0.5.16"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
roxmltree = "0.21.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
url = "2"
rtrb = "0.3"
hound = "3.5.1"
lofty = "0.24.0"
notify = "8.2.0"
pinyin = "0.11.0"
rubato = { version = "4.0.0", default-features = false }
symphonia = { version = "0.6.0", features = ["aac", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2.0.19"
walkdir = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.1", optional = true }
alsa = "0.11.0"
pipewire = { version = "0.10.0", features = ["v1_2_0"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.1"
rusqlite = "0.40.1"

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
