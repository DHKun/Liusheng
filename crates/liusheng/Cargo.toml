[package]
name = "liusheng"
version = "0.1.0"
edition = "2024"

[dependencies]
cxx = "1.0"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_gui", "qt_qml"] }
liusheng-core = { path = "../liusheng-core" }
zbus = "5.16.0"

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }

[dev-dependencies]
tempfile = "3.27"
