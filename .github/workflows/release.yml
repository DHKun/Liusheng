name: Release packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Local reusable workflows are resolved at the caller's exact commit.
  # Tag-only releases run the same complete Linux/macOS checks as ordinary CI.
  quality:
    uses: ./.github/workflows/quality.yml

  deb:
    name: Build Debian 13 DEB
    needs: quality
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            dpkg-dev \
            git \
            libasound2-dev \
            libpipewire-0.3-dev \
            lld \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash ./scripts/package.sh deb --version "$RELEASE_VERSION"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: liusheng-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Build Fedora 44 RPM
    needs: quality
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install checkout dependencies
        run: dnf install -y git

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build and packaging dependencies
        run: |
          dnf install -y \
            alsa-lib-devel \
            cargo \
            clang \
            gcc-c++ \
            lld \
            pipewire-devel \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            rpm-build \
            rust

      - name: Build package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash ./scripts/package.sh rpm --version "$RELEASE_VERSION"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: liusheng-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  appimage:
    name: Build Linux AppImage
    needs: quality
    uses: ./.github/workflows/package-appimage.yml
    with:
      version: ${{ github.ref_name }}

  macos:
    name: Build macOS arm64 app
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Native system media controls
        run: python3 scripts/check-macos-media.py --output target/qa/macos/media-controls

      - name: Install Qt
        run: |
          brew install qt flac
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Update checker transport and release policy
        run: python3 scripts/check-updates.py --output target/qa/macos/updates

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate native workspace and developer CLI
        shell: bash
        run: |
          cargo check -p liusheng-core --all-targets --locked
          cargo test --workspace --locked
          python3 scripts/check-watcher.py --rounds 5 --output target/qa/macos/watcher
          cargo build -p liusheng-core --example dev --locked
          python3 scripts/check-dev-cli.py target/debug/examples/dev

      - name: Build application bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash ./scripts/package-macos.sh --version "$RELEASE_VERSION"

      - name: Verify relocated packaged macOS application
        shell: bash
        run: bash scripts/check-macos-bundle.sh dist/*-macos-arm64.zip target/qa/macos/packaged

      - name: Archive macOS release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-release-validation
          path: target/qa/macos
          if-no-files-found: warn
          retention-days: 7

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: liusheng-macos-arm64
          path: dist/*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7

  deb-runtime:
    name: Validate installed DEB in a clean runtime
    needs: deb
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install test runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 fonts-noto-cjk
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: liusheng-deb
          path: dist
      - name: Install actual release package
        run: apt-get install -y --no-install-recommends "$GITHUB_WORKSPACE"/dist/*.deb
      - name: Validate package version and installed executable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(dpkg-query -W -f='${Version}' liusheng)" = "${RELEASE_TAG#v}"
          python3 scripts/check-installed-package.py --prefix /usr --output target/qa/deb
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-package-validation-deb
          path: target/qa/deb

  rpm-runtime:
    name: Validate installed RPM in a clean runtime
    needs: rpm
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install test runtime
        run: dnf install -y git python3
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: liusheng-rpm
          path: dist
      - name: Install actual release package
        run: dnf install -y dist/*.rpm
      - name: Validate package version and installed executable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(rpm -q --qf '%{VERSION}' liusheng)" = "${RELEASE_TAG#v}"
          python3 scripts/check-installed-package.py --prefix /usr --output target/qa/rpm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-package-validation-rpm
          path: target/qa/rpm

  publish:
    name: Publish GitHub Release
    needs: [deb, rpm, appimage, macos, deb-runtime, rpm-runtime]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: liusheng-*
          path: dist
          merge-multiple: true

      - name: Validate all release assets and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check-release-assets.py --directory dist --version "${RELEASE_TAG#v}"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Resolve versioned release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          notes="docs/releases/$RELEASE_TAG.md"
          if [[ -f "$notes" && -s "$notes" && ! -L "$notes" ]]; then
            printf 'path=%s\n' "$notes" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: 留声 ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          body: |
            安装包：

            - `deb` 适用于 Debian 13。
            - `rpm` 适用于 Fedora 44。
            - `AppImage` 适用于 Linux x86_64（glibc 2.41+，随包提供 Qt）。
            - `macos-arm64.zip` 适用于 Apple Silicon Mac。
            - `SHA256SUMS` 用于校验下载文件。
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*-macos-arm64.zip
            dist/SHA256SUMS
