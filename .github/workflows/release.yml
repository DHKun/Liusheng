name: Release packages

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Test workspace
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            flac \
            git \
            libasound2-dev \
            libpipewire-0.3-dev \
            lld \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add clippy rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  deb:
    name: Build Debian 13 DEB
    needs: quality
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            curl \
            dpkg-dev \
            git \
            libasound2-dev \
            libpipewire-0.3-dev \
            lld \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash ./scripts/package.sh deb --version "$RELEASE_VERSION"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: liusheng-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  rpm:
    name: Build Fedora 44 RPM
    needs: quality
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install checkout dependencies
        run: dnf install -y git

      - name: Check out source
        uses: actions/checkout@v6

      - name: Install build and packaging dependencies
        run: |
          dnf install -y \
            alsa-lib-devel \
            cargo \
            clang \
            gcc-c++ \
            lld \
            pipewire-devel \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            rpm-build \
            rust

      - name: Build package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash ./scripts/package.sh rpm --version "$RELEASE_VERSION"

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: liusheng-rpm
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 7

  arch:
    name: Build Arch Linux package
    needs: quality
    uses: ./.github/workflows/package-arch.yml
    with:
      version: ${{ github.ref_name }}

  macos:
    name: Build macOS ${{ matrix.arch }} app
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt
        run: |
          brew install qt flac
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate native workspace and developer CLI
        shell: bash
        run: |
          cargo check -p liusheng-core --all-targets --locked
          cargo test --workspace --locked
          python3 scripts/check-watcher.py --rounds 5 --output target/qa/macos/watcher
          cargo build -p liusheng-core --example dev --locked
          python3 scripts/check-dev-cli.py target/debug/examples/dev

      - name: Build application bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash ./scripts/package-macos.sh --version "$RELEASE_VERSION"

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: liusheng-macos-${{ matrix.arch }}
          path: dist/*-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [deb, rpm, arch, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: liusheng-*
          path: dist
          merge-multiple: true

      - name: Validate all release assets and generate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check-release-assets.py --directory dist --version "${RELEASE_TAG#v}"
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: 留声 ${{ github.ref_name }}
          body: |
            安装包：

            - `deb` 适用于 Debian 13。
            - `rpm` 适用于 Fedora 44。
            - `pkg.tar.zst` 适用于 Arch Linux x86_64。
            - `macos-arm64.zip` 适用于 Apple Silicon Mac。
            - `macos-x86_64.zip` 适用于 Intel Mac。
            - `SHA256SUMS` 用于校验下载文件。
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.zip
            dist/SHA256SUMS
